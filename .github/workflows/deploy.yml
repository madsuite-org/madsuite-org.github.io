name: deploy

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build and deploy website
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          # gh-pages accepts pushes only from a deploy key (repository ruleset)
          install -m 600 /dev/null ~/deploy_key
          printf '%s\n' "$DEPLOY_KEY" > ~/deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git config --global user.email "git@github.com"
          git config --global user.name "Github action runner"
          python3 -m venv venv
          source venv/bin/activate
          pip3 install .
          python3 -m madsuiteorg deploy
