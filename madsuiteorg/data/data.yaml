packages:
  - category: "Solvers"
    items:
      - name: "MadNLP.jl"
        url: "https://github.com/madsuite-org/MadNLP.jl"
        description: "Nonlinear programming solver (filter line-search interior-point method) with GPU support"
      - name: "MadIPM.jl"
        url: "https://github.com/madsuite-org/MadIPM.jl"
        description: "Linear and quadratic programming solver (Mehrotra predictor-corrector) with GPU support"
      - name: "MadNCL.jl"
        url: "https://github.com/madsuite-org/MadNCL.jl"
        description: "Algorithm NCL as a MadNLP.jl extension, for infeasible or degenerate problems"
      - name: "CCOpt.jl"
        url: "https://github.com/madsuite-org/CCOpt.jl"
        description: "Solver for mathematical programs with complementarity constraints (MPCCs)"
  - category: "Modeling abstractions and algebraic modeling systems"
    items:
      - name: "ExaModels.jl"
        url: "https://github.com/madsuite-org/ExaModels.jl"
        description: "Algebraic modeling and automatic differentiation for GPUs, based on a SIMD abstraction of nonlinear programs"
      - name: "MPCCModels.jl"
        url: "https://github.com/madsuite-org/MPCCModels.jl"
        description: "NLPModels.jl extension for modeling MPCCs, used by CCOpt.jl"
      - name: "NLPModelsExtensions.jl"
        url: "https://github.com/madsuite-org/NLPModelsExtensions.jl"
        description: "Extensions to NLPModels.jl"
      - name: "ExaPowerIO.jl"
        url: "https://github.com/madsuite-org/ExaPowerIO.jl"
        description: "Minimal reader for the MATPOWER power system data format"
  - category: "Domain-specific libraries"
    items:
      - name: "ExaModelsPower.jl"
        url: "https://github.com/madsuite-org/ExaModelsPower.jl"
        description: "Optimal power flow models built on ExaModels.jl"
      - name: "ExaModelsCollocation.jl"
        url: "https://github.com/madsuite-org/ExaModelsCollocation.jl"
        description: "Transcription of differential equations into algebraic constraints in ExaModels.jl"
  - category: "Other tools"
    items:
      - name: "MadCheck.jl"
        url: "https://github.com/madsuite-org/MadCheck.jl"
        description: "Automatic diagnosis tool for nonlinear programs"
  - category: "Benchmark libraries"
    items:
      - name: "COPSBenchmark.jl"
        url: "https://github.com/madsuite-org/COPSBenchmark.jl"
        description: "The COPS benchmark for nonlinear optimization, with JuMP and ExaModels backends"
      - name: "ExaCUTEst.jl"
        url: "https://github.com/madsuite-org/ExaCUTEst.jl"
        description: "The CUTEst test set as ExaModels, on the CPU or a GPU"
      - name: "ExaModelsSIF.jl"
        url: "https://github.com/madsuite-org/ExaModelsSIF.jl"
        description: "Pure-Julia SIF decoder: CUTEst problems as native ExaModels"
      - name: "ExaMittelmann.jl"
        url: "https://github.com/madsuite-org/ExaMittelmann.jl"
        description: "Mittelmann's AMPL-NLP benchmark instances as ExaModels"
      - name: "LuksanVlcekBenchmark.jl"
        url: "https://github.com/madsuite-org/LuksanVlcekBenchmark.jl"
        description: "Lukšan-Vlček scalable test problems as ExaModels"
      - name: "MPCCbenchmark.jl"
        url: "https://github.com/madsuite-org/MPCCbenchmark.jl"
        description: "Large-scale mathematical programs with complementarity constraints"
      - name: "MadNLPBenchmark.jl"
        url: "https://github.com/madsuite-org/MadNLPBenchmark.jl"
        description: "Baseline benchmark for tracking MadNLP.jl performance across commits"

