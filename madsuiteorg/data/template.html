<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{title}</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dejavu-sans@5/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dejavu-sans@5/700.css">
  <style>
    :root {{ --ms-purple: #534AB7; --ms-green: #3B6D11; --ms-red: #A32D2D; --ms-ink: #1A1A1A; }}
    body {{ color: var(--ms-ink); font-family: 'DejaVu Sans', 'Bitstream Vera Sans', Verdana, sans-serif; font-size: 0.95rem; }}
    h1, h2, h3, h4, h5 {{ font-family: inherit; }}
    a {{ color: var(--ms-purple); }}
    a:hover {{ color: var(--ms-red); }}
    .navbar {{ border-bottom: 0 !important; }}
    .navbar::after {{ content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
      background: linear-gradient(90deg, var(--ms-green) 0 33.3%, var(--ms-purple) 33.3% 66.6%, var(--ms-red) 66.6% 100%); }}
    h2 {{ color: var(--ms-purple); border-bottom: 2px solid var(--ms-purple); padding-bottom: .25rem; }}
    h4 {{ color: var(--ms-green); }}
    figcaption {{ color: #555; }}
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg border-bottom fixed-top bg-white">
    <div class="container">
      <a class="navbar-brand" href="#"><img src="assets/madsuite-logo.svg" alt="{title}" height="36"></a>
    </div>
  </nav>
  
  <!-- Main Content -->
  <div style="margin-top: 70px; margin-bottom: 70px;">
  <div class="container my-5">
    {content}
  </div>
  </div>
  
  <!-- Footer -->
  <footer class="border-top py-3 bg-white">
    <div class="container text-center text-muted small">
      &copy; {year} {title}. All rights reserved.
    </div>
  </footer>
  
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
